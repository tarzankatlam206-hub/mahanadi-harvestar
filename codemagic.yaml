workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate Android project
        script: |
          npx expo prebuild --platform android

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
