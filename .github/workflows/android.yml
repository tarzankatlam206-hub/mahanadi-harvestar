name: Build Mahanadi APK - Local Free
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx expo prebuild --platform android --clean
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
      - run: cp android/app/build/outputs/apk/release/app-release.apk mahanadi-harvester-sangh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mahanadi-harvester-sangh-apk
          path: mahanadi-harvester-sangh.apk
