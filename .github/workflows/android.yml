name: Build Mahanadi APK - Local Free
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx expo install expo-asset
      - run: npx expo prebuild --platform android --clean
      - name: Fix Kotlin 1.9.24 -> 1.9.25 everywhere
        run: |
          sed -i "s/1\.9\.24/1.9.25/g" android/build.gradle || true
          sed -i "s/1\.9\.24/1.9.25/g" android/app/build.gradle || true
          sed -i "s/1\.5\.15/1.5.14/g" node_modules/expo-modules-core/android/build.gradle || true
          find android -type f -name "*.gradle" -exec sed -i "s/1\.9\.24/1.9.25/g" {} + || true
          find android -type f -name "*.gradle" -exec sed -i "s/1\.5\.15/1.5.14/g" {} + || true
          echo "kotlinVersion=1.9.25" >> android/gradle.properties
          echo "Fixed versions"
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
      - run: cp android/app/build/outputs/apk/release/app-release.apk mahanadi-harvester-sangh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mahanadi-harvester-sangh-apk
          path: mahanadi-harvester-sangh.apk
