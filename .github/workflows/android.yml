name: Build Mahanadi APK - Local Free
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Create icon
        run: |
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > assets/icon.png

      - name: Install deps
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix gradle path bug
        run: |
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle').read_text()
          p = p.replace(\"require.resolve('expo/package.json')\", \"'/home/runner/work/mahanadi-home-app/mahanadi-home-app/node_modules/expo/package.json'\")
          pathlib.Path('android/app/build.gradle').write_text(p)
          print('patched')
          "

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahanadi-harvester-sangh-apk
          path: android/app/build/outputs/apk/release/app-release.apk
