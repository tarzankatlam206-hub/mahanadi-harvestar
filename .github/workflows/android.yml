name: Build Mahanadi APK - Local Free
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create icon and eas config
        run: |
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > assets/icon.png
          echo '{"build":{"preview":{"distribution":"internal","android":{"buildType":"apk"}}}}' > eas.json

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS Local
        run: eas build --platform android --profile preview --local --non-interactive --output ./Mahanadi.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahanadi-harvester-sangh-apk
          path: ./Mahanadi.apk
